# Promtail: lee los logs JSON de Nginx del volumen compartido y los envía a Loki.
# Nota: Promtail está en fase de fin de vida; Grafana Alloy es su reemplazo
# (ver DEPLOY.md). La configuración del pipeline es equivalente.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: honeypot
    static_configs:
      - targets: [localhost]
        labels:
          job: honeypot
          __path__: /var/log/nginx/honeypot_access.json
    pipeline_stages:
      - json:
          expressions:
            msec: msec
            route: route
            status: status
            request_method: request_method
            link_technique: link_technique
            via_cloudflare: via_cloudflare
      # Pocas etiquetas y de baja cardinalidad; IP y User-Agent quedan en la
      # línea JSON y se filtran en las consultas con `| json`.
      - labels:
          route:
          status:
          method: request_method
          technique: link_technique
          via_cloudflare:
      - timestamp:
          source: msec
          format: Unix

  - job_name: nginx_default
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx_default
          __path__: /var/log/nginx/default_access.json
    pipeline_stages:
      - json:
          expressions:
            msec: msec
      - timestamp:
          source: msec
          format: Unix
