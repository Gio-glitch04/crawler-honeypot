# Override SOLO para pruebas locales. Nada queda expuesto fuera de tu PC:
# todos los puertos se publican en 127.0.0.1.
#
#   docker compose --env-file local/.env.local -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Diferencias con producción:
#   - Nginx en 127.0.0.1:8080 (HTTP) y 127.0.0.1:8443 (HTTPS), no en 80/443.
#   - Certificado autofirmado generado automáticamente (servicio local-certs).
#   - server_name localhost y la red Docker del simulador tratada como Cloudflare.
#   - Base ASN falsa (servicio local-asn-db), sin cuenta de MaxMind.
#   - Servicio simulator (perfil "sim") que imita crawlers.

services:
  local-certs:
    image: python:3.12-slim
    command:
      - sh
      - -c
      - >-
        test -s /certs/honeypot.pem ||
        openssl req -x509 -nodes -newkey rsa:2048 -days 365
        -keyout /certs/honeypot.key -out /certs/honeypot.pem -subj /CN=localhost
    volumes:
      - local-certs:/certs
    network_mode: none

  local-asn-db:
    build: ./local/
    command: python make_test_asn_db.py /geoip/GeoLite2-ASN.mmdb
    volumes:
      - geoip-data:/geoip
    network_mode: none

  nginx-proxy:
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - local-certs:/etc/nginx/certs:ro
      - ./local/honeypot-local.conf:/etc/nginx/conf.d/honeypot.conf:ro
      - ./local/cloudflare_realip.conf:/etc/nginx/snippets/cloudflare_realip.conf:ro
      - ./local/cloudflare_geo.conf:/etc/nginx/snippets/cloudflare_geo.conf:ro
    depends_on:
      local-certs:
        condition: service_completed_successfully
      honeypot-app:
        condition: service_started

  honeypot-app:
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

  analytics:
    depends_on:
      local-asn-db:
        condition: service_completed_successfully
      loki:
        condition: service_started

  simulator:
    build: ./local/
    profiles: ["sim"]
    command: python simulate.py http://nginx-proxy
    environment:
      SIM_HOST: localhost
    depends_on: [nginx-proxy]
    networks: [honeypot_net]

networks:
  honeypot_net:
    ipam:
      config:
        - subnet: 10.99.0.0/16

volumes:
  local-certs:
