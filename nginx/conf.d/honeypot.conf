# Dominio aislado del honeypot (decisión 1 de memory.md).
# Reemplazar el dominio con scripts/configure.sh o a mano.
upstream honeypot_app {
    server honeypot-app:8000;
    keepalive 16;
}

server {
    # Se sirve igual por HTTP y HTTPS (sin redirección) para no perder ni
    # alterar peticiones de crawlers que entren por HTTP.
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name __HONEYPOT_DOMAIN__ www.__HONEYPOT_DOMAIN__;

    # Certificado de origen de Cloudflare (modo SSL "Full (strict)").
    ssl_certificate     /etc/nginx/certs/honeypot.pem;
    ssl_certificate_key /etc/nginx/certs/honeypot.key;

    access_log /var/log/nginx/honeypot_access.json honeypot_json;
    error_log  /var/log/nginx/honeypot_error.log warn;

    client_max_body_size 64k;

    location / {
        proxy_pass http://honeypot_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Metadatos internos: Nginx los registra y no los envía al cliente.
        proxy_hide_header X-Honeypot-Route;
        proxy_hide_header X-Honeypot-Technique;
        proxy_hide_header X-Honeypot-Token-Issued;
        proxy_hide_header X-Honeypot-Depth;
    }
}
