user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # --- IP real detrás de Cloudflare (decisión 3 de memory.md) -------------
    # Solo se confía en CF-Connecting-IP si la conexión viene de un rango de
    # Cloudflare; si alguien pega directo al origen, $remote_addr queda con su
    # IP real y no puede falsificarla con la cabecera.
    include /etc/nginx/snippets/cloudflare_realip.conf;
    real_ip_header CF-Connecting-IP;

    # 1 si la conexión TCP vino de Cloudflare, 0 si fue directa al origen.
    geo $realip_remote_addr $via_cloudflare {
        default 0;
        include /etc/nginx/snippets/cloudflare_geo.conf;
    }

    # --- Log JSON para el experimento (specs.md §4) ------------------------
    # tls_version/tls_cipher son del tramo Cloudflare->origen. Los del cliente
    # real solo los conoce Cloudflare: se reciben en X-Client-TLS-* / X-JA*
    # si se configura la Transform Rule descrita en DEPLOY.md.
    log_format honeypot_json escape=json
        '{'
          '"timestamp":"$time_iso8601",'
          '"msec":"$msec",'
          '"remote_ip":"$remote_addr",'
          '"cf_connecting_ip":"$http_cf_connecting_ip",'
          '"peer_ip":"$realip_remote_addr",'
          '"via_cloudflare":"$via_cloudflare",'
          '"host":"$host",'
          '"scheme":"$scheme",'
          '"request_method":"$request_method",'
          '"request_uri":"$request_uri",'
          '"server_protocol":"$server_protocol",'
          '"status":"$status",'
          '"body_bytes_sent":"$body_bytes_sent",'
          '"request_time":"$request_time",'
          '"http_referer":"$http_referer",'
          '"http_user_agent":"$http_user_agent",'
          '"http_accept":"$http_accept",'
          '"http_accept_language":"$http_accept_language",'
          '"http_accept_encoding":"$http_accept_encoding",'
          '"tls_version":"$ssl_protocol",'
          '"tls_cipher":"$ssl_cipher",'
          '"client_tls_version":"$http_x_client_tls_version",'
          '"client_tls_cipher":"$http_x_client_tls_cipher",'
          '"ja3":"$http_x_client_ja3",'
          '"ja4":"$http_x_client_ja4",'
          '"cf_ray":"$http_cf_ray",'
          '"cf_country":"$http_cf_ipcountry",'
          '"cf_visitor":"$http_cf_visitor",'
          '"route":"$upstream_http_x_honeypot_route",'
          '"link_technique":"$upstream_http_x_honeypot_technique",'
          '"link_issued":"$upstream_http_x_honeypot_token_issued",'
          '"link_depth":"$upstream_http_x_honeypot_depth"'
        '}';

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    include /etc/nginx/conf.d/*.conf;
}
