{% extends "trap/base.html" %}
{% block title %}{{ dataset.title }}{% endblock %}
{% block content %}
<h2>{{ dataset.title }}</h2>
<p><em>{{ dataset.summary }}</em></p>
{% for p in dataset.paragraphs %}<p>{{ p }}</p>
{% endfor %}
<table><thead><tr><th>Año</th><th>Valor</th></tr></thead><tbody>
{% for r in dataset.rows %}<tr><td>{{ r.year }}</td><td>{{ r.value }}</td></tr>
{% endfor %}</tbody></table>
{% endblock %}
